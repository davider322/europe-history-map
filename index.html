<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Map of Europe</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111; color: #fff; }
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #timeline-container {
            --timeline-surface: #f1e2c6;
            --timeline-border: #b18a5d;
            --timeline-roller-border: #9e7447;
            --timeline-roller-gradient: linear-gradient(90deg, #a77b4b 0, #e6c99a 35%, #f5e8ca 55%, #c69c64 100%);
            --timeline-roller-shadow: inset 1px 0 2px rgba(255, 248, 229, 0.8), 0 1px 3px rgba(65, 43, 20, 0.22);
            --timeline-year-color: #4a3520;
            --timeline-mark-border: #9e7447;
            --timeline-mark-gradient: linear-gradient(90deg, #b18450, #f3dfb8 50%, #b18450);
            --timeline-mark-shadow: inset 0 1px 1px rgba(255, 248, 229, 0.9), 0 1px 1px rgba(65, 43, 20, 0.2);
            --timeline-track-color: #b18450;
            --timeline-thumb-border: #f1e2c6;
            --timeline-thumb-background: #80603c;
            --timeline-thumb-shadow: 0 0 0 1px #a77b4b;
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: min(680px, calc(100vw - 72px));
            box-sizing: border-box;
            background: var(--timeline-surface);
            padding: 6px 22px 7px;
            border: 1px solid var(--timeline-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            box-shadow:
                inset 0 1px 0 rgba(255, 248, 229, 0.9),
                0 4px 14px rgba(65, 43, 20, 0.2);
        }

        #timeline-container::before,
        #timeline-container::after {
            position: absolute;
            top: -4px;
            bottom: -4px;
            width: 10px;
            border: 1px solid var(--timeline-roller-border);
            border-radius: 6px;
            background: var(--timeline-roller-gradient);
            box-shadow: var(--timeline-roller-shadow);
            content: '';
            pointer-events: none;
        }

        #timeline-container::before {
            left: -8px;
        }

        #timeline-container::after {
            right: -8px;
        }

        #year-display {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.15rem;
            font-weight: bold;
            letter-spacing: 0.06em;
            color: var(--timeline-year-color);
        }

        #year-note {
            color: #755b3e;
            font-size: 0.68rem;
            line-height: 1.2;
            text-align: center;
        }

        #map-status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            max-width: min(600px, calc(100vw - 40px));
            padding: 10px 14px;
            border-radius: 8px;
            background: rgba(20, 20, 20, 0.9);
            color: #fff;
            text-align: center;
        }

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            background: #f1e2c6;
            color: #4a3520;
        }

        .leaflet-popup-content-wrapper {
            position: relative;
            border: 1px solid #b18a5d;
            border-radius: 5px;
            box-shadow: 0 5px 18px rgba(65, 43, 20, 0.24);
        }

        .leaflet-popup-content-wrapper::before,
        .leaflet-popup-content-wrapper::after {
            position: absolute;
            left: -2px;
            right: -2px;
            height: 7px;
            border: 1px solid #9e7447;
            border-radius: 5px;
            background: linear-gradient(
                180deg,
                #f5e8ca 0,
                #e6c99a 52%,
                #a77b4b 100%
            );
            box-shadow: inset 0 1px 2px rgba(255, 248, 229, 0.9);
            content: '';
            pointer-events: none;
        }

        .leaflet-popup-content-wrapper::before {
            top: -4px;
            box-shadow:
                inset 0 1px 2px rgba(255, 248, 229, 0.9);
        }

        .leaflet-popup-content-wrapper::after {
            bottom: -4px;
        }

        .leaflet-popup-content {
            margin: 17px 16px;
            min-width: 150px;
        }

        .realm-popup {
            font-family: Georgia, 'Times New Roman', serif;
            text-align: center;
        }

        .realm-popup__title {
            display: block;
            max-width: 260px;
            padding: 0;
            border: 0;
            background: none;
            color: #4a3520;
            font: inherit;
            font-size: 1.12rem;
            font-weight: 700;
            line-height: 1.2;
            cursor: pointer;
        }

        .realm-popup__title:hover,
        .realm-popup__title:focus-visible {
            color: #111;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .realm-popup__province {
            display: block;
            margin-top: 5px;
            color: #755b3e;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 0.82rem;
        }

        #realm-panel {
            position: absolute;
            z-index: 1200;
            top: 24px;
            bottom: 24px;
            left: 24px;
            width: min(390px, calc(100vw - 48px));
            box-sizing: border-box;
            overflow-y: auto;
            padding: 26px;
            border: 1px solid #b18a5d;
            border-radius: 8px;
            background:
                linear-gradient(90deg, rgba(126, 91, 49, 0.08), transparent 18px),
                #f1e2c6;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.32);
            color: #4a3520;
            font-family: Georgia, 'Times New Roman', serif;
        }

        #realm-panel::before,
        #realm-panel::after {
            position: absolute;
            left: 0;
            right: 0;
            height: 10px;
            border: 1px solid #9e7447;
            border-radius: 7px;
            background: linear-gradient(
                180deg,
                #f5e8ca 0,
                #e6c99a 52%,
                #a77b4b 100%
            );
            box-shadow:
                inset 0 2px 3px rgba(255, 248, 229, 0.9),
                1px 2px 4px rgba(65, 43, 20, 0.28);
            content: '';
            pointer-events: none;
        }

        #realm-panel::before {
            top: 0;
            box-shadow:
                inset 0 2px 3px rgba(255, 248, 229, 0.9);
        }

        #realm-panel::after {
            bottom: 0;
        }

        #realm-panel[hidden] {
            display: none;
        }

        .realm-panel__close {
            position: absolute;
            top: 16px;
            right: 12px;
            width: 34px;
            height: 34px;
            border: 1px solid #b18a5d;
            border-radius: 50%;
            background: #f5e8ca;
            color: #4a3520;
            font-size: 1.3rem;
            cursor: pointer;
        }

        .realm-panel__eyebrow {
            margin: 8px 42px 8px 0;
            color: #755b3e;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        #realm-panel-title {
            margin: 0 32px 18px 0;
            color: #4a3520;
            font-size: clamp(1.7rem, 6vw, 2.15rem);
            line-height: 1.08;
        }

        .realm-panel__portrait {
            display: grid;
            min-height: 210px;
            place-items: center;
            margin: 0 0 20px;
            border: 1px solid #b18a5d;
            background:
                linear-gradient(rgba(255, 248, 229, 0.6), rgba(255, 248, 229, 0.6)),
                repeating-linear-gradient(135deg, #e6c99a 0 12px, #f5e8ca 12px 24px);
            color: #755b3e;
            text-align: center;
        }

        .realm-panel__portrait span {
            padding: 8px 12px;
            border: 1px solid rgba(158, 116, 71, 0.45);
            background: rgba(255, 248, 229, 0.92);
            font-size: 0.92rem;
            font-style: italic;
        }

        .realm-panel__section {
            margin: 0 0 17px;
        }

        .realm-panel__label {
            display: block;
            margin-bottom: 4px;
            color: #755b3e;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        #realm-panel-ruler,
        #realm-panel-info {
            margin: 0;
            font-size: 1rem;
            line-height: 1.6;
        }

        .timeline-track {
            position: relative;
            width: 100%;
            height: 15px;
        }

        .timeline-period-marks {
            position: absolute;
            z-index: 2;
            inset: 0 9px;
            pointer-events: none;
        }

        .timeline-period-mark {
            position: absolute;
            top: 50%;
            left: var(--mark-position);
            width: 4px;
            height: 8px;
            transform: translate(-50%, -50%);
            border: 1px solid var(--timeline-mark-border);
            border-radius: 3px;
            background: var(--timeline-mark-gradient);
            box-shadow: var(--timeline-mark-shadow);
        }

        .slider {
            -webkit-appearance: none;
            appearance: none;
            position: relative;
            z-index: 1;
            width: 100%;
            height: 15px;
            margin: 0;
            border-radius: 8px;
            background: linear-gradient(
                to bottom,
                transparent 0,
                transparent 5px,
                var(--timeline-track-color) 5px,
                var(--timeline-track-color) 10px,
                transparent 10px
            );
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 2px solid var(--timeline-thumb-border);
            background: var(--timeline-thumb-background);
            box-shadow: var(--timeline-thumb-shadow);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .slider::-moz-range-thumb {
            width: 11px;
            height: 11px;
            border: 2px solid var(--timeline-thumb-border);
            border-radius: 50%;
            background: var(--timeline-thumb-background);
            box-shadow: var(--timeline-thumb-shadow);
            cursor: pointer;
        }

        @media (max-width: 600px) {
            #timeline-container {
                bottom: 16px;
                width: calc(100vw - 48px);
                padding: 6px 18px 7px;
            }

            #year-display {
                font-size: 1rem;
            }
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Add this class to #timeline-container to restore the saved gray variant. */
        #timeline-container.timeline-container--gray {
            --timeline-surface: #f5f6f6;
            --timeline-border: #c8ccce;
            --timeline-roller-border: #aeb3b5;
            --timeline-roller-gradient: linear-gradient(90deg, #aeb3b5 0, #e4e6e7 35%, #f9fafa 55%, #d9dcdd 100%);
            --timeline-roller-shadow: inset 1px 0 2px rgba(255, 255, 255, 0.9), 0 1px 3px rgba(0, 0, 0, 0.18);
            --timeline-year-color: #42484b;
            --timeline-mark-border: #8c9295;
            --timeline-mark-gradient: linear-gradient(90deg, #aeb3b5, #f7f8f8 50%, #aeb3b5);
            --timeline-mark-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.9), 0 1px 1px rgba(0, 0, 0, 0.16);
            --timeline-track-color: #aeb3b5;
            --timeline-thumb-border: #f5f6f6;
            --timeline-thumb-background: #72797c;
            --timeline-thumb-shadow: 0 0 0 1px #92989b;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.95),
                0 4px 14px rgba(33, 39, 42, 0.2);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="map-status" role="status" aria-live="polite">Loading map...</div>

    <aside id="realm-panel" aria-labelledby="realm-panel-title" aria-hidden="true" hidden>
        <button class="realm-panel__close" type="button" aria-label="Close realm information">×</button>
        <p class="realm-panel__eyebrow">Historical realm</p>
        <h1 id="realm-panel-title"></h1>
        <div class="realm-panel__portrait" role="img" aria-label="Portrait placeholder">
            <span>Portrait placeholder</span>
        </div>
        <section class="realm-panel__section">
            <span class="realm-panel__label">Ruler</span>
            <p id="realm-panel-ruler"></p>
        </section>
        <section class="realm-panel__section">
            <span class="realm-panel__label">About this realm</span>
            <p id="realm-panel-info"></p>
        </section>
    </aside>

    <div id="timeline-container">
        <div id="year-display">Year: <span id="current-year">1000</span></div>
        <div id="year-note" hidden></div>
        <div class="timeline-track">
            <div class="timeline-period-marks" aria-hidden="true"></div>
            <input type="range" min="0" max="0" value="0" step="1" class="slider" id="year-slider" aria-label="Select year" disabled>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const europeBounds = L.latLngBounds([[24, -30], [72, 50]]);
        const map = L.map('map', {
            maxBounds: europeBounds,
            maxBoundsViscosity: 1,
            minZoom: 4
        });
        map.fitBounds(europeBounds, { padding: [16, 16] });
        const status = document.getElementById('map-status');

        // Esri World Shaded Relief: no modern labels or borders
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ | Boundaries &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a> (ODbL 1.0), <a href="https://www.geoboundaries.org/">geoBoundaries</a> (mixed licenses; see feature metadata), and <a href="https://gisco-services.ec.europa.eu/">Eurostat GISCO</a> (NUTS 2021, CC BY 4.0)',
            maxZoom: 13,
            maxNativeZoom: 13
        }).addTo(map);

        let activeLayers = [];
        let europeRegionsData = null;
        let timelineDatabase = null;
        let supplementalRegions = null;
        let supplementalIslands = null;
        let middleEastRegions = null;
        let microstateRegions = null;
        let historicalRegionData = null;
        let availableYears = [];
        let currentLoad = 0;
        let realmLabelSequence = 0;
        const realmPanel = document.getElementById('realm-panel');

        function openRealmPanel(props) {
            document.getElementById('realm-panel-title').textContent =
                props.realm || 'Unknown realm';
            document.getElementById('realm-panel-ruler').textContent =
                props.leader || 'Unknown';
            document.getElementById('realm-panel-info').textContent =
                props.info || 'No historical information has been added yet.';
            realmPanel.hidden = false;
            realmPanel.setAttribute('aria-hidden', 'false');
        }

        function closeRealmPanel() {
            realmPanel.hidden = true;
            realmPanel.setAttribute('aria-hidden', 'true');
        }

        function clearMap() {
            activeLayers.forEach(layer => map.removeLayer(layer));
            activeLayers = [];
        }

        function pruneInternalSeams(lines, features) {
            const EPS = 0.04;
            const CELL = 0.1;
            const pk = p => `${p[0].toFixed(7)},${p[1].toFixed(7)}`;
            const polygonsFor = geometry => {
                if (geometry.type === 'Polygon') return [geometry.coordinates];
                if (geometry.type === 'MultiPolygon') return geometry.coordinates;
                return [];
            };
            const grid = new Map();
            const owner = new Map();
            const boxes = features.map(() => [Infinity, Infinity, -Infinity, -Infinity]);
            features.forEach((feature, fi) => {
                polygonsFor(feature.geometry).forEach(polygon => polygon.forEach(ring => {
                    for (let i = 0; i < ring.length - 1; i++) {
                        const a = ring[i];
                        const b = ring[i + 1];
                        const box = boxes[fi];
                        box[0] = Math.min(box[0], a[0]); box[1] = Math.min(box[1], a[1]);
                        box[2] = Math.max(box[2], a[0]); box[3] = Math.max(box[3], a[1]);
                        const k1 = pk(a);
                        const k2 = pk(b);
                        const ek = k1 < k2 ? `${k1}|${k2}` : `${k2}|${k1}`;
                        if (!owner.has(ek)) owner.set(ek, fi);
                        const x0 = Math.floor((Math.min(a[0], b[0]) - EPS) / CELL);
                        const x1 = Math.floor((Math.max(a[0], b[0]) + EPS) / CELL);
                        const y0 = Math.floor((Math.min(a[1], b[1]) - EPS) / CELL);
                        const y1 = Math.floor((Math.max(a[1], b[1]) + EPS) / CELL);
                        for (let x = x0; x <= x1; x++) {
                            for (let y = y0; y <= y1; y++) {
                                const ck = `${x},${y}`;
                                if (!grid.has(ck)) grid.set(ck, []);
                                grid.get(ck).push({ a, b, fi });
                            }
                        }
                    }
                }));
            });
            const dist2 = (p, a, b) => {
                const dx = b[0] - a[0];
                const dy = b[1] - a[1];
                const len2 = dx * dx + dy * dy;
                let t = len2 ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / len2 : 0;
                t = Math.max(0, Math.min(1, t));
                const ex = a[0] + t * dx - p[0];
                const ey = a[1] + t * dy - p[1];
                return ex * ex + ey * ey;
            };
            const isInternal = (a, b) => {
                const k1 = pk(a);
                const k2 = pk(b);
                const fi = owner.get(k1 < k2 ? `${k1}|${k2}` : `${k2}|${k1}`);
                if (fi === undefined) return false;
                const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
                const edges = grid.get(`${Math.floor(mid[0] / CELL)},${Math.floor(mid[1] / CELL)}`) || [];
                if (edges.some(e => e.fi !== fi && dist2(mid, e.a, e.b) < EPS * EPS)) return true;
                return features.some((feature, other) => {
                    const box = boxes[other];
                    return other !== fi &&
                        mid[0] >= box[0] && mid[0] <= box[2] && mid[1] >= box[1] && mid[1] <= box[3] &&
                        polygonsFor(feature.geometry).some(polygon =>
                            pointInRing(mid[0], mid[1], polygon[0]) &&
                            !polygon.slice(1).some(hole => pointInRing(mid[0], mid[1], hole))
                        );
                });
            };

            const result = [];
            lines.forEach(line => {
                let current = [];
                for (let i = 0; i < line.length - 1; i++) {
                    if (isInternal(line[i], line[i + 1])) {
                        if (current.length > 1) result.push(current);
                        current = [];
                    } else {
                        if (current.length === 0) current.push(line[i]);
                        current.push(line[i + 1]);
                    }
                }
                if (current.length > 1) result.push(current);
            });
            return result;
        }

        function getRealmBoundaryLines(features) {
            const lines = getRawRealmBoundaryLines(features);
            return features.length > 1 ? pruneInternalSeams(lines, features) : lines;
        }

        function getRawRealmBoundaryLines(features) {
            const edges = new Map();
            const pointKey = point =>
                `${Number(point[0]).toFixed(7)},${Number(point[1]).toFixed(7)}`;
            const polygonsFor = geometry => {
                if (geometry.type === 'Polygon') return [geometry.coordinates];
                if (geometry.type === 'MultiPolygon') return geometry.coordinates;
                return [];
            };

            features.forEach(feature => {
                polygonsFor(feature.geometry).forEach(polygon => {
                    polygon.forEach(ring => {
                        for (let i = 0; i < ring.length - 1; i++) {
                            const start = ring[i];
                            const end = ring[i + 1];
                            const startKey = pointKey(start);
                            const endKey = pointKey(end);
                            if (startKey === endKey) continue;

                            const key = startKey < endKey
                                ? `${startKey}|${endKey}`
                                : `${endKey}|${startKey}`;
                            const edge = edges.get(key);
                            if (edge) {
                                edge.count++;
                            } else {
                                edges.set(key, {
                                    count: 1,
                                    start,
                                    end,
                                    startKey,
                                    endKey
                                });
                            }
                        }
                    });
                });
            });

            const boundaryEdges = [...edges.values()]
                .filter(edge => edge.count % 2 === 1);
            const adjacency = new Map();
            const pointByKey = new Map();
            boundaryEdges.forEach((edge, index) => {
                [[edge.startKey, edge.start], [edge.endKey, edge.end]].forEach(
                    ([key, point]) => {
                        if (!adjacency.has(key)) adjacency.set(key, []);
                        adjacency.get(key).push(index);
                        pointByKey.set(key, point);
                    }
                );
            });

            const unused = new Set(boundaryEdges.map((_, index) => index));
            const traceLine = (startKey, firstEdgeIndex) => {
                const coordinates = [pointByKey.get(startKey)];
                let currentKey = startKey;
                let edgeIndex = firstEdgeIndex;

                while (edgeIndex !== undefined && unused.has(edgeIndex)) {
                    unused.delete(edgeIndex);
                    const edge = boundaryEdges[edgeIndex];
                    currentKey = edge.startKey === currentKey
                        ? edge.endKey
                        : edge.startKey;
                    coordinates.push(pointByKey.get(currentKey));

                    if (currentKey === startKey) break;
                    const nextEdges = (adjacency.get(currentKey) || [])
                        .filter(index => unused.has(index));
                    if (nextEdges.length !== 1) break;
                    [edgeIndex] = nextEdges;
                }

                return coordinates.length > 1 ? coordinates : null;
            };

            const lines = [];
            adjacency.forEach((edgeIndices, key) => {
                if (edgeIndices.length === 2) return;
                edgeIndices.forEach(index => {
                    if (unused.has(index)) {
                        const line = traceLine(key, index);
                        if (line) lines.push(line);
                    }
                });
            });
            while (unused.size > 0) {
                const index = unused.values().next().value;
                const edge = boundaryEdges[index];
                const line = traceLine(edge.startKey, index);
                if (line) lines.push(line);
            }

            const hasKosovo = features.some(feature => feature.properties.id === 'kosovo');
            if (!hasKosovo || features.length < 2) return lines;

            const inKosovoArea = ([x, y]) => x > 19.9 && x < 21.9 && y > 41.8 && y < 43.3;
            const realmContains = point => features.some(feature =>
                polygonsFor(feature.geometry).some(polygon =>
                    pointInRing(point[0], point[1], polygon[0]) &&
                    !polygon.slice(1).some(hole => pointInRing(point[0], point[1], hole))
                )
            );
            const offset = 0.0006;
            const result = [];
            lines.forEach(line => {
                let run = [];
                for (let i = 0; i < line.length - 1; i++) {
                    const [x1, y1] = line[i];
                    const [x2, y2] = line[i + 1];
                    const mid = [(x1 + x2) / 2, (y1 + y2) / 2];
                    let internal = false;
                    if (inKosovoArea(mid)) {
                        const length = Math.hypot(x2 - x1, y2 - y1) || 1;
                        const nx = -(y2 - y1) / length * offset;
                        const ny = (x2 - x1) / length * offset;
                        internal = realmContains([mid[0] + nx, mid[1] + ny]) &&
                            realmContains([mid[0] - nx, mid[1] - ny]);
                    }
                    if (internal) {
                        if (run.length > 1) result.push(run);
                        run = [];
                    } else {
                        if (run.length === 0) run.push(line[i]);
                        run.push(line[i + 1]);
                    }
                }
                if (run.length > 1) result.push(run);
            });
            return result;
        }

        function blendColors(firstColor, secondColor, ratio) {
            const first = /^#?([\da-f]{6})$/i.exec(firstColor || '');
            const second = /^#?([\da-f]{6})$/i.exec(secondColor || '');
            if (!first || !second) return firstColor;

            const firstRgb = first[1].match(/.{2}/g).map(value => parseInt(value, 16));
            const secondRgb = second[1].match(/.{2}/g).map(value => parseInt(value, 16));
            const blended = firstRgb.map((value, index) =>
                Math.round(value + (secondRgb[index] - value) * ratio)
            );
            return `#${blended.map(value => value.toString(16).padStart(2, '0')).join('')}`;
        }

        function pointInRing(longitude, latitude, ring) {
            let inside = false;
            for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
                const [x1, y1] = ring[i];
                const [x2, y2] = ring[j];
                if (
                    (y1 > latitude) !== (y2 > latitude) &&
                    longitude < ((x2 - x1) * (latitude - y1)) / (y2 - y1) + x1
                ) {
                    inside = !inside;
                }
            }
            return inside;
        }

        function isPointInFeature(longitude, latitude, feature) {
            const geometry = feature.geometry;
            const polygons = geometry.type === 'Polygon'
                ? [geometry.coordinates]
                : geometry.type === 'MultiPolygon'
                    ? geometry.coordinates
                    : [];
            return polygons.some(rings =>
                rings.length > 0 &&
                pointInRing(longitude, latitude, rings[0]) &&
                !rings.slice(1).some(ring => pointInRing(longitude, latitude, ring))
            );
        }

        function findRealmLabelPositions(features, bounds, preferredPosition) {
            const west = bounds.getWest();
            const east = bounds.getEast();
            const south = bounds.getSouth();
            const north = bounds.getNorth();
            const preferred = preferredPosition || [
                bounds.getCenter().lat,
                bounds.getCenter().lng
            ];
            const candidates = [{position: preferred, distance: -1}];

            for (const divisions of [8, 16]) {
                for (let x = 1; x < divisions; x++) {
                    for (let y = 1; y < divisions; y++) {
                        const longitude = west + (east - west) * x / divisions;
                        const latitude = south + (north - south) * y / divisions;
                        if (!features.some(feature =>
                            isPointInFeature(longitude, latitude, feature)
                        )) {
                            continue;
                        }
                        const dx = (longitude - preferred[1]) / (east - west);
                        const dy = (latitude - preferred[0]) / (north - south);
                        candidates.push({
                            position: [latitude, longitude],
                            distance: dx * dx + dy * dy
                        });
                    }
                }
            }

            candidates.sort((a, b) => a.distance - b.distance);
            return candidates.map(candidate => candidate.position);
        }

        // Builds a gently curved label path along the realm's long axis by
        // rasterising it and following the centre of the widest connected span.
        function computeAutoLabelCurve(features, bounds) {
            if (!bounds.isValid()) return null;
            const GRID = 220;
            const toMercator = latitude => {
                const radians = Math.max(-85.05112878, Math.min(85.05112878, latitude)) *
                    Math.PI / 180;
                return Math.log(Math.tan(Math.PI / 4 + radians / 2));
            };
            const xMin = bounds.getWest() * Math.PI / 180;
            const xSpan = (bounds.getEast() - bounds.getWest()) * Math.PI / 180;
            const yMax = toMercator(bounds.getNorth());
            const ySpan = yMax - toMercator(bounds.getSouth());
            if (!(xSpan > 0) || !(ySpan > 0)) return null;
            const scale = GRID / Math.max(xSpan, ySpan);
            const width = Math.max(8, Math.ceil(xSpan * scale));
            const height = Math.max(8, Math.ceil(ySpan * scale));

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const context = canvas.getContext('2d', {willReadFrequently: true});
            if (!context) return null;
            context.fillStyle = '#000';
            context.strokeStyle = '#000';
            context.lineWidth = 1;
            features.forEach(feature => {
                const geometry = feature.geometry;
                const rings = geometry.type === 'Polygon'
                    ? geometry.coordinates
                    : geometry.type === 'MultiPolygon'
                        ? geometry.coordinates.flat()
                        : [];
                context.beginPath();
                rings.forEach(ring => {
                    ring.forEach(([longitude, latitude], index) => {
                        const x = (longitude * Math.PI / 180 - xMin) * scale;
                        const y = (yMax - toMercator(latitude)) * scale;
                        if (index === 0) context.moveTo(x, y);
                        else context.lineTo(x, y);
                    });
                    context.closePath();
                });
                context.fill('evenodd');
                context.stroke();
            });
            const pixels = context.getImageData(0, 0, width, height).data;
            const isInside = (x, y) => {
                const column = Math.round(x);
                const row = Math.round(y);
                return column >= 0 && column < width && row >= 0 && row < height &&
                    pixels[(row * width + column) * 4 + 3] > 40;
            };

            let count = 0;
            let sumX = 0;
            let sumY = 0;
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    if (isInside(x, y)) {
                        count++;
                        sumX += x;
                        sumY += y;
                    }
                }
            }
            if (count < 12) return null;
            const meanX = sumX / count;
            const meanY = sumY / count;
            let covXX = 0;
            let covYY = 0;
            let covXY = 0;
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    if (!isInside(x, y)) continue;
                    covXX += (x - meanX) ** 2;
                    covYY += (y - meanY) ** 2;
                    covXY += (x - meanX) * (y - meanY);
                }
            }
            covXX /= count;
            covYY /= count;
            covXY /= count;
            const root = Math.sqrt(((covXX - covYY) / 2) ** 2 + covXY ** 2);
            const major = (covXX + covYY) / 2 + root;
            const minor = Math.max(1e-6, (covXX + covYY) / 2 - root);
            const elongation = Math.sqrt(major / minor);
            const isSmallRealm = Math.max(xSpan, ySpan) < 0.1;
            const maxTilt = (isSmallRealm ? 25 : 65) * Math.PI / 180;
            let theta = elongation < 1.35
                ? 0
                : 0.5 * Math.atan2(2 * covXY, covXX - covYY);

            // Realms split by water: run the label axis through the main land masses.
            const componentIds = new Int32Array(width * height);
            const components = [];
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    if (!isInside(x, y) || componentIds[y * width + x]) continue;
                    const id = components.length + 1;
                    const stack = [[x, y]];
                    componentIds[y * width + x] = id;
                    let area = 0;
                    let cx = 0;
                    let cy = 0;
                    while (stack.length) {
                        const [px, py] = stack.pop();
                        area++;
                        cx += px;
                        cy += py;
                        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
                            const nx = px + dx;
                            const ny = py + dy;
                            if (nx < 0 || ny < 0 || nx >= width || ny >= height) return;
                            if (componentIds[ny * width + nx] || !isInside(nx, ny)) return;
                            componentIds[ny * width + nx] = id;
                            stack.push([nx, ny]);
                        });
                    }
                    components.push({area, x: cx / area, y: cy / area});
                }
            }
            const majorComponents = components.filter(item => item.area >= count * 0.12);
            if (majorComponents.length >= 2) {
                const totalArea = majorComponents.reduce((sum, item) => sum + item.area, 0);
                const mx = majorComponents.reduce((sum, item) => sum + item.x * item.area, 0) / totalArea;
                const my = majorComponents.reduce((sum, item) => sum + item.y * item.area, 0) / totalArea;
                let sxx = 0;
                let syy = 0;
                let sxy = 0;
                majorComponents.forEach(item => {
                    sxx += item.area * (item.x - mx) ** 2;
                    syy += item.area * (item.y - my) ** 2;
                    sxy += item.area * (item.x - mx) * (item.y - my);
                });
                if (sxx + syy > 1e-6) theta = 0.5 * Math.atan2(2 * sxy, sxx - syy);
            }
            theta = Math.max(-maxTilt, Math.min(maxTilt, theta));
            const ux = Math.cos(theta);
            const uy = Math.sin(theta);
            const vx = -uy;
            const vy = ux;

            const radius = Math.hypot(width, height) / 2;
            const offset = Math.ceil(radius);
            const profileCenter = new Array(2 * offset + 1).fill(null);
            const profileThickness = new Array(2 * offset + 1).fill(0);
            for (let u = -offset; u <= offset; u++) {
                let bestStart = null;
                let bestLength = 0;
                let runStart = null;
                for (let v = -offset; v <= offset + 1; v++) {
                    const inside = v <= offset && isInside(
                        meanX + u * ux + v * vx,
                        meanY + u * uy + v * vy
                    );
                    if (inside && runStart === null) runStart = v;
                    if (!inside && runStart !== null) {
                        const length = v - runStart;
                        if (length > bestLength) {
                            bestLength = length;
                            bestStart = runStart;
                        }
                        runStart = null;
                    }
                }
                if (bestStart !== null) {
                    profileCenter[u + offset] = bestStart + (bestLength - 1) / 2;
                    profileThickness[u + offset] = bestLength;
                }
            }

            const thicknesses = profileThickness.filter(value => value > 0)
                .sort((a, b) => a - b);
            if (thicknesses.length < 6) return null;
            const referenceThickness = thicknesses[Math.floor(thicknesses.length * 0.9)];
            const minimumThickness = Math.max(2, referenceThickness * 0.3);
            const isGood = index => profileThickness[index] >= minimumThickness;

            const intervals = [];
            let start = null;
            for (let index = 0; index <= profileCenter.length; index++) {
                const good = index < profileCenter.length && isGood(index);
                if (good && start === null) start = index;
                if (!good && start !== null) {
                    intervals.push([start, index - 1]);
                    start = null;
                }
            }
            if (intervals.length === 0) return null;
            const totalSpan = intervals[intervals.length - 1][1] - intervals[0][0];
            const maximumGap = totalSpan * 0.3;
            const merged = [intervals[0].slice()];
            for (let i = 1; i < intervals.length; i++) {
                const last = merged[merged.length - 1];
                if (intervals[i][0] - last[1] <= maximumGap) {
                    last[1] = intervals[i][1];
                } else {
                    merged.push(intervals[i].slice());
                }
            }
            const [first, last] = merged.reduce((best, interval) =>
                interval[1] - interval[0] > best[1] - best[0] ? interval : best
            );
            const span = last - first;
            if (span < 6) return null;

            const centers = [];
            const goodThicknesses = [];
            for (let index = first; index <= last; index++) {
                if (isGood(index)) {
                    centers[index - first] = profileCenter[index];
                    goodThicknesses.push(profileThickness[index]);
                } else {
                    centers[index - first] = null;
                }
            }
            for (let i = 0; i < centers.length; i++) {
                if (centers[i] !== null) continue;
                let before = i - 1;
                while (before >= 0 && centers[before] === null) before--;
                let after = i + 1;
                while (after < centers.length && centers[after] === null) after++;
                centers[i] = centers[before] + (centers[after] - centers[before]) *
                    (i - before) / (after - before);
            }
            const windowHalf = Math.max(2, Math.round(centers.length * 0.12));
            const smoothed = centers.map((_, i) => {
                let sum = 0;
                let total = 0;
                for (let k = Math.max(0, i - windowHalf);
                     k <= Math.min(centers.length - 1, i + windowHalf); k++) {
                    sum += centers[k];
                    total++;
                }
                return sum / total;
            });

            const trim = 0.06;
            const pointAt = fraction => {
                const position = (trim + (1 - 2 * trim) * fraction) * span;
                const low = Math.floor(position);
                const high = Math.min(span, low + 1);
                const mix = position - low;
                const u = first - offset + position;
                const v = smoothed[low] + (smoothed[high] - smoothed[low]) * mix;
                return [meanX + u * ux + v * vx, meanY + u * uy + v * vy];
            };
            const p0 = pointAt(0);
            const q1 = pointAt(1 / 3);
            const q2 = pointAt(2 / 3);
            const p3 = pointAt(1);
            const control = axis => [
                (-5 * p0[axis] + 18 * q1[axis] - 9 * q2[axis] + 2 * p3[axis]) / 6,
                (2 * p0[axis] - 9 * q1[axis] + 18 * q2[axis] - 5 * p3[axis]) / 6
            ];
            const [c1x, c2x] = control(0);
            const [c1y, c2y] = control(1);
            const toLatLng = ([x, y]) => [
                (2 * Math.atan(Math.exp(yMax - y / scale)) - Math.PI / 2) * 180 / Math.PI,
                (xMin + x / scale) * 180 / Math.PI
            ];

            goodThicknesses.sort((a, b) => a - b);
            const thickness = goodThicknesses[Math.floor(goodThicknesses.length * 0.25)] *
                (majorComponents.length >= 2 ? 0.65 : 1);
            return {
                curve: [
                    toLatLng(p0),
                    toLatLng([c1x, c1y]),
                    toLatLng([c2x, c2y]),
                    toLatLng(p3)
                ],
                thickness: thickness / scale
            };
        }

        function createRealmLabelLayer(features, bounds, props) {
            const configuredLabel = typeof props.label === 'string'
                ? props.label
                : props.realm;
            if (typeof configuredLabel !== 'string' || !configuredLabel || !bounds.isValid()) {
                return null;
            }
            const labelText = configuredLabel.replace(
                /^(?:(?:grand )?duchy|kingdom|caliphate|principality|emirate|county|sharifate|sultanate|earldom|lordship) of\s+/i,
                ''
            );

            const preferredLabelPosition = Array.isArray(props.labelPosition) &&
                props.labelPosition.length === 2 &&
                props.labelPosition.every(Number.isFinite)
                ? props.labelPosition
                : [bounds.getCenter().lat, bounds.getCenter().lng];
            const manualCurve = Array.isArray(props.labelCurve) &&
                props.labelCurve.length === 4 &&
                props.labelCurve.every(point =>
                    Array.isArray(point) &&
                    point.length === 2 &&
                    point.every(Number.isFinite)
                )
                ? props.labelCurve
                : null;
            const hasManualPlacement = manualCurve ||
                Number.isFinite(props.labelAngle) ||
                (Array.isArray(props.labelPosition) && props.labelPosition.length === 2);
            const autoLabel = !hasManualPlacement && props.labelAuto !== false
                ? computeAutoLabelCurve(features, bounds)
                : null;
            const labelCurve = manualCurve || (autoLabel ? autoLabel.curve : null);
            const ignoreRealmGeometry = Boolean(
                props.labelCurveIgnoreRealmGeometry || autoLabel
            );
            const projectLatitude = latitude => {
                const radians = Math.max(
                    -85.05112878,
                    Math.min(85.05112878, latitude)
                ) * Math.PI / 180;
                return Math.log(Math.tan(Math.PI / 4 + radians / 2));
            };
            const labelBounds = labelCurve
                ? (() => {
                    const latitudes = labelCurve.map(([latitude]) => latitude);
                    const longitudes = labelCurve.map(([, longitude]) => longitude);
                    const projectedLatitudes = latitudes.map(projectLatitude);
                    const centerLongitude =
                        (Math.min(...longitudes) + Math.max(...longitudes)) / 2;
                    const centerProjectedLatitude =
                        (Math.min(...projectedLatitudes) +
                            Math.max(...projectedLatitudes)) / 2;
                    const longitudeSpanInRadians =
                        (Math.max(...longitudes) - Math.min(...longitudes)) *
                        Math.PI / 180;
                    const projectedLatitudeSpan =
                        Math.max(...projectedLatitudes) -
                        Math.min(...projectedLatitudes);
                    const halfProjectedSpan =
                        Math.max(longitudeSpanInRadians, projectedLatitudeSpan) * 0.62;
                    const west =
                        centerLongitude - halfProjectedSpan * 180 / Math.PI;
                    const east =
                        centerLongitude + halfProjectedSpan * 180 / Math.PI;
                    const southProjectedLatitude =
                        centerProjectedLatitude - halfProjectedSpan;
                    const northProjectedLatitude =
                        centerProjectedLatitude + halfProjectedSpan;
                    const unprojectLatitude = projectedLatitude =>
                        (2 * Math.atan(Math.exp(projectedLatitude)) -
                            Math.PI / 2) * 180 / Math.PI;
                    return L.latLngBounds([
                        [
                            unprojectLatitude(southProjectedLatitude),
                            west
                        ],
                        [
                            unprojectLatitude(northProjectedLatitude),
                            east
                        ]
                    ]);
                })()
                : bounds;
            const namespace = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(namespace, 'svg');
            svg.setAttribute('xmlns', namespace);
            svg.setAttribute('viewBox', '0 0 1000 1000');
            svg.setAttribute('preserveAspectRatio', 'none');
            svg.setAttribute('aria-hidden', 'true');

            const west = labelBounds.getWest();
            const east = labelBounds.getEast();
            const south = projectLatitude(labelBounds.getSouth());
            const north = projectLatitude(labelBounds.getNorth());
            const toSvgPoint = ([longitude, latitude]) => [
                ((longitude - west) / (east - west)) * 1000,
                ((north - projectLatitude(latitude)) / (north - south)) * 1000
            ];
            const fromSvgPoint = ([x, y]) => {
                const mercatorY = north - (y / 1000) * (north - south);
                return [
                    west + (x / 1000) * (east - west),
                    (2 * Math.atan(Math.exp(mercatorY)) - Math.PI / 2) * 180 / Math.PI
                ];
            };
            const polygonRings = geometry => {
                if (geometry.type === 'Polygon') return geometry.coordinates;
                if (geometry.type === 'MultiPolygon') return geometry.coordinates.flat();
                return [];
            };
            const paths = features.flatMap(feature =>
                polygonRings(feature.geometry).map(ring => {
                    const points = ring.map(toSvgPoint);
                    if (points.length < 4) return '';
                    return `M${points.map(([x, y]) => `${x},${y}`).join('L')}Z`;
                })
            ).filter(Boolean);
            if (paths.length === 0) return null;

            const definitions = document.createElementNS(namespace, 'defs');
            const clipPath = document.createElementNS(namespace, 'clipPath');
            const clipPathId = `realm-label-clip-${++realmLabelSequence}`;
            clipPath.setAttribute('id', clipPathId);
            clipPath.setAttribute('clipPathUnits', 'userSpaceOnUse');
            const clipShape = document.createElementNS(namespace, 'path');
            clipShape.setAttribute('d', paths.join(''));
            clipShape.setAttribute('fill-rule', 'evenodd');
            clipShape.setAttribute('clip-rule', 'evenodd');
            clipPath.appendChild(clipShape);
            definitions.appendChild(clipPath);
            svg.appendChild(definitions);

            const projectedCurve = labelCurve
                ? labelCurve.map(([latitude, longitude]) =>
                    toSvgPoint([longitude, latitude])
                )
                : null;
            let curvedTextPath = null;
            let curvedPathId = null;
            if (projectedCurve) {
                const [start, control1, control2, end] = projectedCurve;
                const pathData = `M${start[0]},${start[1]} C${control1[0]},${control1[1]} ${control2[0]},${control2[1]} ${end[0]},${end[1]}`;
                curvedPathId = `realm-label-path-${++realmLabelSequence}`;
                curvedTextPath = document.createElementNS(namespace, 'path');
                curvedTextPath.setAttribute('id', curvedPathId);
                curvedTextPath.setAttribute('d', pathData);
                definitions.appendChild(curvedTextPath);
            }

            const label = document.createElementNS(namespace, 'text');
            label.textContent = labelText.toLocaleUpperCase('en');
            label.setAttribute('font-family', "Georgia, 'Times New Roman', serif");
            const unitsPerRadian = 1000 / ((east - west) * Math.PI / 180);
            const thicknessLimit = autoLabel
                ? autoLabel.thickness * unitsPerRadian * 0.8
                : null;
            const maxFontSize = autoLabel
                ? Math.max(4, Number.isFinite(props.labelFontSize)
                    ? Math.min(props.labelFontSize, thicknessLimit)
                    : thicknessLimit)
                : Number.isFinite(props.labelFontSize)
                    ? props.labelFontSize
                    : Math.min(94, 700 / labelText.length);
            label.setAttribute('font-weight', '700');
            const configuredLetterSpacing = Number.isFinite(props.labelLetterSpacing)
                ? props.labelLetterSpacing
                : null;
            label.setAttribute(
                'letter-spacing',
                String(configuredLetterSpacing === null ? 10 : configuredLetterSpacing)
            );
            label.setAttribute('text-anchor', 'middle');
            label.setAttribute('dominant-baseline', 'central');
            label.setAttribute('fill', '#000000');
            const angle = Number.isFinite(props.labelAngle) ? props.labelAngle : 0;
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            if (!context) throw new Error('Could not measure realm label text.');
            const candidatePositions = findRealmLabelPositions(
                features,
                bounds,
                preferredLabelPosition
            );
            let chosenPosition = null;
            let chosenFontSize = null;

            for (
                let fontSize = maxFontSize;
                fontSize >= 2 && chosenPosition === null;
                fontSize -= Math.max(2, Math.round(maxFontSize / 24))
            ) {
                const letterSpacing = configuredLetterSpacing === null
                    ? fontSize * 0.12
                    : configuredLetterSpacing;
                context.font = `700 ${fontSize}px Georgia`;
                const textWidth = context.measureText(label.textContent).width +
                    letterSpacing * Math.max(0, labelText.length - 1);
                const halfWidth = textWidth / 2;
                const halfHeight = fontSize * 0.55;
                if (projectedCurve) {
                    const [start, control1, control2, end] = projectedCurve;
                    const curvePoints = [];
                    for (let step = 0; step <= 100; step++) {
                        const t = step / 100;
                        const inverseT = 1 - t;
                        const x = inverseT ** 3 * start[0] +
                            3 * inverseT ** 2 * t * control1[0] +
                            3 * inverseT * t ** 2 * control2[0] +
                            t ** 3 * end[0];
                        const y = inverseT ** 3 * start[1] +
                            3 * inverseT ** 2 * t * control1[1] +
                            3 * inverseT * t ** 2 * control2[1] +
                            t ** 3 * end[1];
                        curvePoints.push([x, y]);
                    }
                    const distances = [0];
                    for (let i = 1; i < curvePoints.length; i++) {
                        distances.push(
                            distances[i - 1] +
                            Math.hypot(
                                curvePoints[i][0] - curvePoints[i - 1][0],
                                curvePoints[i][1] - curvePoints[i - 1][1]
                            )
                        );
                    }
                    const pathLength = distances[distances.length - 1];
                    const requestedCurveTextLength = Number.isFinite(
                        props.labelCurveTextLength
                    )
                        ? Math.max(0.1, Math.min(1, props.labelCurveTextLength))
                        : null;
                    const fittedTextWidth = requestedCurveTextLength === null
                        ? textWidth
                        : pathLength * requestedCurveTextLength;
                    if (fittedTextWidth > pathLength || fittedTextWidth <= 0) continue;

                    const pointAtDistance = distance => {
                        let index = 1;
                        while (index < distances.length - 1 && distances[index] < distance) {
                            index++;
                        }
                        const segmentLength = distances[index] - distances[index - 1];
                        const ratio = segmentLength === 0
                            ? 0
                            : (distance - distances[index - 1]) / segmentLength;
                        return [
                            curvePoints[index - 1][0] +
                                (curvePoints[index][0] - curvePoints[index - 1][0]) * ratio,
                            curvePoints[index - 1][1] +
                                (curvePoints[index][1] - curvePoints[index - 1][1]) * ratio
                        ];
                    };
                    const curveStart = (pathLength - fittedTextWidth) / 2;
                    let fits = true;
                    if (!ignoreRealmGeometry) {
                        for (let sample = 0; sample <= 20 && fits; sample++) {
                            const distance = curveStart + fittedTextWidth * sample / 20;
                            const point = pointAtDistance(distance);
                            const before = pointAtDistance(Math.max(0, distance - 1));
                            const after = pointAtDistance(Math.min(pathLength, distance + 1));
                            const tangentLength = Math.hypot(
                                after[0] - before[0],
                                after[1] - before[1]
                            ) || 1;
                            const normalX = -(after[1] - before[1]) / tangentLength;
                            const normalY = (after[0] - before[0]) / tangentLength;

                            for (const offset of [-halfHeight, 0, halfHeight]) {
                                const [testLongitude, testLatitude] = fromSvgPoint([
                                    point[0] + normalX * offset,
                                    point[1] + normalY * offset
                                ]);
                                if (!features.some(feature =>
                                    isPointInFeature(testLongitude, testLatitude, feature)
                                )) {
                                    fits = false;
                                    break;
                                }
                            }
                        }
                    }
                    if (fits) {
                        const midpoint = curvePoints[50];
                        const [midpointLongitude, midpointLatitude] = fromSvgPoint(midpoint);
                        chosenPosition = [midpointLatitude, midpointLongitude];
                        chosenFontSize = fontSize;
                    }
                    continue;
                }

                const radians = angle * Math.PI / 180;
                const cos = Math.cos(radians);
                const sin = Math.sin(radians);

                for (const [latitude, longitude] of candidatePositions) {
                    const [centerX, centerY] = toSvgPoint([longitude, latitude]);
                    let fits = true;
                    for (let xStep = 0; xStep <= 16 && fits; xStep++) {
                        const textX = -halfWidth + (textWidth * xStep / 16);
                        for (const textY of [-halfHeight, 0, halfHeight]) {
                            const projectedX = centerX + textX * cos - textY * sin;
                            const projectedY = centerY + textX * sin + textY * cos;
                            const [testLongitude, testLatitude] = fromSvgPoint([
                                projectedX,
                                projectedY
                            ]);
                            if (!features.some(feature =>
                                isPointInFeature(testLongitude, testLatitude, feature)
                            )) {
                                fits = false;
                                break;
                            }
                        }
                    }
                    if (fits) {
                        chosenPosition = [latitude, longitude];
                        chosenFontSize = fontSize;
                        break;
                    }
                }
            }

            if (!chosenPosition) return null;
            label.setAttribute('font-size', String(chosenFontSize));
            if (configuredLetterSpacing === null) {
                label.setAttribute('letter-spacing', String(chosenFontSize * 0.12));
            }
            if (!ignoreRealmGeometry) {
                label.setAttribute('clip-path', `url(#${clipPathId})`);
            }
            if (curvedTextPath) {
                const textPath = document.createElementNS(namespace, 'textPath');
                textPath.setAttribute('href', `#${curvedPathId}`);
                const configuredStartOffset = Number.isFinite(
                    props.labelCurveStartOffset
                )
                    ? Math.max(0, Math.min(1, props.labelCurveStartOffset))
                    : 0.5;
                textPath.setAttribute(
                    'startOffset',
                    `${configuredStartOffset * 100}%`
                );
                textPath.setAttribute(
                    'text-anchor',
                    configuredStartOffset === 0 ? 'start' : 'middle'
                );
                if (Number.isFinite(props.labelCurveTextLength)) {
                    const pathLength = curvedTextPath.getTotalLength();
                    const textLength = Math.max(
                        0.1,
                        Math.min(1, props.labelCurveTextLength)
                    ) * pathLength;
                    textPath.setAttribute('textLength', String(textLength));
                    textPath.setAttribute('lengthAdjust', 'spacingAndGlyphs');
                }
                textPath.textContent = label.textContent;
                label.replaceChildren(textPath);
            } else {
                const [labelX, labelY] = toSvgPoint([
                    chosenPosition[1],
                    chosenPosition[0]
                ]);
                label.setAttribute('x', String(labelX));
                label.setAttribute('y', String(labelY));
                label.setAttribute(
                    'transform',
                    `rotate(${angle} ${labelX} ${labelY})`
                );
            }
            svg.appendChild(label);

            return L.svgOverlay(
                svg,
                labelBounds,
                { interactive: false }
            );
        }

        function createRealmBoundaryLayers(features, props) {
            const borderColor = props.borderColor || '#0a131c';
            const lightBorderColor = blendColors(
                borderColor,
                props.fillColor || '#1e3d59',
                0.55
            );
            const boundaryLines = getRealmBoundaryLines(features)
                .map(line => line.map(([longitude, latitude]) => [latitude, longitude]));

            return [
                L.polyline(boundaryLines, {
                    color: borderColor,
                    weight: 2.5,
                    opacity: 0.95,
                    dashArray: '8 15',
                    lineCap: 'butt',
                    interactive: false
                }),
                L.polyline(boundaryLines, {
                    color: lightBorderColor,
                    weight: 2.5,
                    opacity: 0.95,
                    dashArray: '8 15',
                    dashOffset: '11.5',
                    lineCap: 'butt',
                    interactive: false
                })
            ];
        }

        function setStatus(message) {
            status.textContent = message;
            status.hidden = !message;
        }

        async function fetchJson(file) {
            const response = await fetch(file);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status} while loading ${file}`);
            }
            return response.json();
        }

        async function loadEuropeData() {
            try {
                [europeRegionsData, timelineDatabase, supplementalRegions, supplementalIslands, middleEastRegions, microstateRegions, historicalRegionData] = await Promise.all([
                    fetchJson('data/europe-provinces.geojson'),
                    fetchJson('data/years.json'),
                    fetchJson('data/europe-kosovo.geojson'),
                    fetchJson('data/europe-small-islands.geojson'),
                    fetchJson('data/middle-east-caucasus-provinces.geojson'),
                    fetchJson('data/europe-microstates.geojson'),
                    fetchJson('data/europe-historical-regions.geojson')
                ]);
                europeRegionsData.features.push(
                    ...supplementalRegions.features,
                    ...supplementalIslands.features,
                    ...middleEastRegions.features,
                    ...microstateRegions.features,
                    ...historicalRegionData.features
                );
                availableYears = Object.keys(timelineDatabase)
                    .map(Number)
                    .filter(Number.isFinite)
                    .sort((a, b) => a - b);

                if (availableYears.length === 0) {
                    throw new Error('data/years.json contains no valid years');
                }

                const slider = document.getElementById('year-slider');
                const timelineMax = Math.max(10, availableYears.length + 1);
                slider.max = String(timelineMax);
                slider.disabled = availableYears.length < 2;
                slider.value = '1';
                const marks = document.querySelector('.timeline-period-marks');
                marks.replaceChildren(...availableYears.map((_, index) => {
                    const mark = document.createElement('span');
                    mark.className = 'timeline-period-mark';
                    mark.style.setProperty(
                        '--mark-position',
                        `${((index + 1) / timelineMax) * 100}%`
                    );
                    return mark;
                }));
                await loadYear(availableYears[0]);
            } catch (error) {
                console.error('Could not start the map:', error);
                setStatus(`The map could not be loaded: ${error.message}`);
            }
        }

        async function resolveYearConfigs(year, visitedYears = new Set()) {
            const yearKey = String(year);
            const yearConfig = timelineDatabase[yearKey];
            if (!yearConfig) {
                throw new Error(`There is no valid map data for ${yearKey}.`);
            }
            if (visitedYears.has(yearKey)) {
                throw new Error(`Year data contains an inheritance cycle at ${yearKey}.`);
            }

            const nextVisitedYears = new Set(visitedYears);
            nextVisitedYears.add(yearKey);

            if (yearConfig.baseYear !== undefined) {
                if (!yearConfig.overrides || typeof yearConfig.overrides !== 'object') {
                    throw new Error(`Year ${yearKey} has no valid realm overrides.`);
                }
                if (yearConfig.additions !== undefined &&
                    !Array.isArray(yearConfig.additions)) {
                    throw new Error(`Year ${yearKey} has no valid added realm list.`);
                }

                const inheritedConfigs = await resolveYearConfigs(
                    yearConfig.baseYear,
                    nextVisitedYears
                );
                const unmatchedRealms = new Set(Object.keys(yearConfig.overrides));
                const resolvedConfigs = inheritedConfigs.map(realmConfig => {
                    const realm = realmConfig.properties?.realm;
                    if (!realm || !Object.prototype.hasOwnProperty.call(
                        yearConfig.overrides,
                        realm
                    )) {
                        return realmConfig;
                    }

                    const override = yearConfig.overrides[realm];
                    unmatchedRealms.delete(realm);
                    return {
                        ...realmConfig,
                        ...(Array.isArray(override.provinces)
                            ? { provinces: override.provinces }
                            : {}),
                        properties: {
                            ...realmConfig.properties,
                            ...override.properties
                        }
                    };
                });
                if (unmatchedRealms.size > 0) {
                    throw new Error(
                        `Year ${yearKey} overrides unknown realms: ${[...unmatchedRealms].join(', ')}.`
                    );
                }
                const existingRealms = new Set(
                    resolvedConfigs.map(config => config.properties?.realm).filter(Boolean)
                );
                const additions = yearConfig.additions || [];
                additions.forEach(addition => {
                    const realm = addition.properties?.realm;
                    if (!realm || !Array.isArray(addition.provinces)) {
                        throw new Error(
                            `Year ${yearKey} contains an added realm without a name or province list.`
                        );
                    }
                    if (existingRealms.has(realm)) {
                        throw new Error(
                            `Year ${yearKey} adds a realm that already exists: ${realm}.`
                        );
                    }
                    existingRealms.add(realm);
                });
                return [...resolvedConfigs, ...additions];
            }

            if (!Array.isArray(yearConfig.countries)) {
                throw new Error(`Year ${yearKey} has no valid realm list.`);
            }
            return Promise.all(
                yearConfig.countries.map(country => fetchJson(country.file))
            );
        }

        async function loadYear(year) {
            const loadId = ++currentLoad;
            clearMap();
            closeRealmPanel();
            document.getElementById('current-year').textContent = year;
            const yearNote = document.getElementById('year-note');
            yearNote.textContent = timelineDatabase[String(year)]?.note || '';
            yearNote.hidden = !yearNote.textContent;
            setStatus('Loading historical regions...');

            try {
                const configs = await resolveYearConfigs(year);
                if (loadId !== currentLoad) return;

                const missingIds = [];
                const realmBoundaryLayers = [];
                const boundaryGroups = new Map();
                const realmMarkerLayers = [];
                const realmLabelLayers = [];
                configs.forEach(realmConfig => {
                    const allowedIds = Array.isArray(realmConfig.provinces)
                        ? realmConfig.provinces
                        : [];
                    const props = realmConfig.properties || {};
                    const allowedIdSet = new Set(allowedIds);
                    const regionFilters = Array.isArray(props.regionFilters)
                        ? props.regionFilters
                        : [];
                    const realmFeatures = europeRegionsData.features.filter(feature => {
                        const featureProps = feature.properties || {};
                        const matchesId = allowedIdSet.has(featureProps.id) &&
                            (!Array.isArray(props.regionAdmins) ||
                                props.regionAdmins.includes(featureProps.admin));
                        const matchesFilter = regionFilters.some(regionFilter => {
                            const matchesProperties = Object.entries(regionFilter)
                                .filter(([key]) => key !== 'ids' && key !== 'excludeIds')
                                .every(([key, value]) => featureProps[key] === value);
                            return matchesProperties &&
                                (!Array.isArray(regionFilter.ids) ||
                                    regionFilter.ids.includes(featureProps.id)) &&
                                (!Array.isArray(regionFilter.excludeIds) ||
                                    !regionFilter.excludeIds.includes(featureProps.id));
                        });
                        return (matchesId || matchesFilter) &&
                            !(Array.isArray(props.excludeIds) &&
                                props.excludeIds.includes(featureProps.id));
                    });
                    const matchedIds = new Set(
                        realmFeatures.map(feature => feature.properties.id)
                    );
                    missingIds.push(...allowedIds.filter(id => !matchedIds.has(id) &&
                        !(Array.isArray(props.excludeIds) && props.excludeIds.includes(id))));

                    if (realmFeatures.length > 0) {
                        const layer = L.geoJSON({
                            type: 'FeatureCollection',
                            features: realmFeatures
                        }, {
                            style: {
                                fillColor: props.fillColor || '#1e3d59',
                                color: props.borderColor || '#0a131c',
                                weight: 0.8,
                                opacity: 0.28,
                                fillOpacity: Number.isFinite(props.fillOpacity)
                                    ? props.fillOpacity
                                    : 0.5
                            },
                            onEachFeature: (feature, featureLayer) => {
                                const popup = createRealmPopup(
                                    feature.properties.name || 'Unknown region',
                                    props,
                                    year
                                );
                                featureLayer.bindPopup(popup);
                            }
                        });
                        layer.addTo(map);
                        activeLayers.push(layer);
                        const groupKey = [
                            String(props.borderGroup || props.realm || '').replace(/\s*\(.*$/, '').replace(/\s+\d+$/, ''),
                            props.fillColor || '',
                            props.borderColor || ''
                        ].join('|');
                        if (!boundaryGroups.has(groupKey)) {
                            boundaryGroups.set(groupKey, { props, features: [], bounds: null, labelled: [] });
                        }
                        const group = boundaryGroups.get(groupKey);
                        group.features.push(...realmFeatures);
                        const realmBounds = layer.getBounds();
                        group.bounds = group.bounds
                            ? group.bounds.extend(realmBounds)
                            : L.latLngBounds(realmBounds.getSouthWest(), realmBounds.getNorthEast());
                        if (typeof props.label === 'string' ? props.label : props.realm) {
                            group.labelled.push({ props, features: realmFeatures, bounds: realmBounds });
                        }
                    }

                    if (Array.isArray(props.markers)) {
                        props.markers.forEach(markerInfo => {
                            const marker = L.circleMarker(
                                [markerInfo.lat, markerInfo.lng],
                                {
                                    radius: 7,
                                    color: props.borderColor || '#0a131c',
                                    fillColor: props.fillColor || '#1e3d59',
                                    fillOpacity: 0.9,
                                    weight: 2
                                }
                            );
                            marker.bindPopup(createRealmPopup(markerInfo.name, props, year));
                            realmMarkerLayers.push(marker);
                        });
                    }
                });

                boundaryGroups.forEach(group => {
                    realmBoundaryLayers.push(
                        ...createRealmBoundaryLayers(group.features, group.props)
                    );
                    // A realm split into several pieces gets one label over the whole group.
                    const own = group.labelled.filter(l => l.props.labelOwn);
                    const shared = group.labelled.filter(l => !l.props.labelOwn);
                    const labelTargets = shared.length === 1
                        ? [{ props: shared[0].props, features: group.features, bounds: group.bounds }, ...own]
                        : group.labelled;
                    labelTargets.forEach(target => {
                        const label = createRealmLabelLayer(target.features, target.bounds, target.props);
                        if (label) realmLabelLayers.push(label);
                    });
                });

                [...realmBoundaryLayers, ...realmMarkerLayers, ...realmLabelLayers].forEach(layer => {
                    layer.addTo(map);
                    activeLayers.push(layer);
                });

                if (missingIds.length > 0) {
                    console.warn(`Region IDs are missing from the map registry for ${year}:`, missingIds);
                    setStatus(`The map loaded, but ${missingIds.length} region(s) are missing from the registry.`);
                } else {
                    setStatus('');
                }
            } catch (error) {
                if (loadId !== currentLoad) return;
                console.error(`Could not load map data for ${year}:`, error);
                setStatus(`Map data for ${year} could not be loaded: ${error.message}`);
            }
        }

        function createRealmPopup(name, props, year) {
            const popup = document.createElement('div');
            popup.className = 'realm-popup';

            const title = document.createElement('button');
            title.className = 'realm-popup__title';
            title.type = 'button';
            title.textContent = props.realm || 'Unknown realm';
            title.setAttribute('aria-label', `Open information about ${title.textContent}`);
            title.addEventListener('click', () => {
                openRealmPanel(props);
                map.closePopup();
            });

            const province = document.createElement('span');
            province.className = 'realm-popup__province';
            province.textContent = `${name} · ${year}`;

            popup.append(title, province);
            return popup;
        }

        const slider = document.getElementById('year-slider');

        document.querySelector('.realm-panel__close').addEventListener(
            'click',
            closeRealmPanel
        );
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') closeRealmPanel();
        });

        slider.addEventListener('input', (e) => {
            const selectedIndex = Math.min(
                Math.max(Number(e.target.value) - 1, 0),
                availableYears.length - 1
            );
            slider.value = String(selectedIndex + 1);
            loadYear(availableYears[selectedIndex]);
        });

        loadEuropeData();
    </script>
</body>
</html>
