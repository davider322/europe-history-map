                const pathData = `M${start[0]},${start[1]} C${control1[0]},${control1[1]} ${control2[0]},${control2[1]} ${end[0]},${end[1]}`;
                curvedPathId = `realm-label-path-${++realmLabelSequence}`;
                curvedTextPath = document.createElementNS(namespace, 'path');
                curvedTextPath.setAttribute('id', curvedPathId);
                curvedTextPath.setAttribute('d', pathData);
                definitions.appendChild(curvedTextPath);
            }

            const label = document.createElementNS(namespace, 'text');
            label.textContent = labelText.toLocaleUpperCase('en');
            label.setAttribute('font-family', LABEL_FONT_STACK);
            const unitsPerRadian = 1000 / ((east - west) * Math.PI / 180);
            const thicknessLimit = autoLabel
                ? autoLabel.thickness * unitsPerRadian * 0.8
                : null;
            const maxFontSize = autoLabel
                ? Math.max(4, Number.isFinite(props.labelFontSize)
                    ? Math.min(props.labelFontSize, thicknessLimit)
                    : thicknessLimit)
                : Number.isFinite(props.labelFontSize)
                    ? props.labelFontSize
                    : Math.min(94, 700 / labelText.length);
            label.setAttribute('font-weight', LABEL_FONT_WEIGHT);
            const configuredLetterSpacing = Number.isFinite(props.labelLetterSpacing)
                ? props.labelLetterSpacing
                : null;
            label.setAttribute(
                'letter-spacing',
                String(configuredLetterSpacing === null ? 10 : configuredLetterSpacing)
            );
            label.setAttribute('text-anchor', 'middle');
            label.setAttribute('dominant-baseline', 'central');
            label.setAttribute('fill', '#111111');
            label.setAttribute('stroke', 'rgba(250, 240, 215, 0.72)');
            label.setAttribute('stroke-linejoin', 'round');
            label.setAttribute('paint-order', 'stroke');
            const angle = Number.isFinite(props.labelAngle) ? props.labelAngle : 0;
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            if (!context) throw new Error('Could not measure realm label text.');
            const candidatePositions = findRealmLabelPositions(
                features,
                bounds,
                preferredLabelPosition
            );
            let chosenPosition = null;
            let chosenFontSize = null;

            for (
                let fontSize = maxFontSize;
                fontSize >= 2 && chosenPosition === null;
                fontSize -= Math.max(2, Math.round(maxFontSize / 24))
            ) {
                const letterSpacing = configuredLetterSpacing === null
                    ? fontSize * LABEL_LETTER_SPACING
                    : configuredLetterSpacing;
                context.font = `${LABEL_FONT_WEIGHT} ${fontSize}px ${LABEL_FONT_STACK}`;
                const textWidth = context.measureText(label.textContent).width +
                    letterSpacing * Math.max(0, labelText.length - 1);
                const halfWidth = textWidth / 2;
                const halfHeight = fontSize * 0.55;
                if (projectedCurve) {
                    const [start, control1, control2, end] = projectedCurve;
                    const curvePoints = [];
                    for (let step = 0; step <= 100; step++) {
                        const t = step / 100;
                        const inverseT = 1 - t;
                        const x = inverseT ** 3 * start[0] +
                            3 * inverseT ** 2 * t * control1[0] +
                            3 * inverseT * t ** 2 * control2[0] +
                            t ** 3 * end[0];
                        const y = inverseT ** 3 * start[1] +
                            3 * inverseT ** 2 * t * control1[1] +
                            3 * inverseT * t ** 2 * control2[1] +
                            t ** 3 * end[1];
                        curvePoints.push([x, y]);
                    }
                    const distances = [0];
                    for (let i = 1; i < curvePoints.length; i++) {
                        distances.push(
                            distances[i - 1] +
                            Math.hypot(
                                curvePoints[i][0] - curvePoints[i - 1][0],
                                curvePoints[i][1] - curvePoints[i - 1][1]
                            )
                        );
                    }
                    const pathLength = distances[distances.length - 1];
                    const requestedCurveTextLength = Number.isFinite(
                        props.labelCurveTextLength
                    )
                        ? Math.max(0.1, Math.min(1, props.labelCurveTextLength))
                        : null;
                    const fittedTextWidth = requestedCurveTextLength === null
                        ? textWidth
                        : pathLength * requestedCurveTextLength;
                    if (fittedTextWidth > pathLength || fittedTextWidth <= 0) continue;

                    const pointAtDistance = distance => {
                        let index = 1;
                        while (index < distances.length - 1 && distances[index] < distance) {
                            index++;
                        }
                        const segmentLength = distances[index] - distances[index - 1];
                        const ratio = segmentLength === 0
                            ? 0
                            : (distance - distances[index - 1]) / segmentLength;
                        return [
                            curvePoints[index - 1][0] +
                                (curvePoints[index][0] - curvePoints[index - 1][0]) * ratio,
                            curvePoints[index - 1][1] +
                                (curvePoints[index][1] - curvePoints[index - 1][1]) * ratio
                        ];
                    };
                    const curveStart = (pathLength - fittedTextWidth) / 2;
                    let fits = true;
                    if (!ignoreRealmGeometry) {
                        for (let sample = 0; sample <= 20 && fits; sample++) {
                            const distance = curveStart + fittedTextWidth * sample / 20;
                            const point = pointAtDistance(distance);
                            const before = pointAtDistance(Math.max(0, distance - 1));
                            const after = pointAtDistance(Math.min(pathLength, distance + 1));
                            const tangentLength = Math.hypot(
                                after[0] - before[0],
                                after[1] - before[1]
                            ) || 1;
                            const normalX = -(after[1] - before[1]) / tangentLength;
                            const normalY = (after[0] - before[0]) / tangentLength;

                            for (const offset of [-halfHeight, 0, halfHeight]) {
                                const [testLongitude, testLatitude] = fromSvgPoint([
                                    point[0] + normalX * offset,
                                    point[1] + normalY * offset
                                ]);
                                if (!features.some(feature =>
                                    isPointInFeature(testLongitude, testLatitude, feature)
                                )) {
                                    fits = false;
                                    break;
                                }
                            }
                        }
                    }
                    if (fits) {
                        const midpoint = curvePoints[50];
                        const [midpointLongitude, midpointLatitude] = fromSvgPoint(midpoint);
                        chosenPosition = [midpointLatitude, midpointLongitude];
                        chosenFontSize = fontSize;
                    }
                    continue;
                }

                const radians = angle * Math.PI / 180;
                const cos = Math.cos(radians);
                const sin = Math.sin(radians);

                for (const [latitude, longitude] of candidatePositions) {
                    const [centerX, centerY] = toSvgPoint([longitude, latitude]);
                    let fits = true;
                    for (let xStep = 0; xStep <= 16 && fits; xStep++) {
                        const textX = -halfWidth + (textWidth * xStep / 16);
                        for (const textY of [-halfHeight, 0, halfHeight]) {
                            const projectedX = centerX + textX * cos - textY * sin;
                            const projectedY = centerY + textX * sin + textY * cos;
                            const [testLongitude, testLatitude] = fromSvgPoint([
                                projectedX,
                                projectedY
                            ]);
                            if (!features.some(feature =>
                                isPointInFeature(testLongitude, testLatitude, feature)
                            )) {
                                fits = false;
                                break;
                            }
                        }
                    }
                    if (fits) {
                        chosenPosition = [latitude, longitude];
                        chosenFontSize = fontSize;
                        break;
                    }
                }
            }

            if (!chosenPosition) return null;
            label.setAttribute('font-size', String(chosenFontSize));
            if (configuredLetterSpacing === null) {
                label.setAttribute('letter-spacing', String(chosenFontSize * LABEL_LETTER_SPACING));
            }
            label.setAttribute('stroke-width', String(Math.max(0.6, chosenFontSize * 0.14)));
            if (!ignoreRealmGeometry) {
                label.setAttribute('clip-path', `url(#${clipPathId})`);
            }
            if (curvedTextPath) {
                const textPath = document.createElementNS(namespace, 'textPath');
                textPath.setAttribute('href', `#${curvedPathId}`);
                const configuredStartOffset = Number.isFinite(
                    props.labelCurveStartOffset
                )
                    ? Math.max(0, Math.min(1, props.labelCurveStartOffset))
                    : 0.5;
                textPath.setAttribute(
                    'startOffset',
                    `${configuredStartOffset * 100}%`
                );
                textPath.setAttribute(
                    'text-anchor',
                    configuredStartOffset === 0 ? 'start' : 'middle'
                );
                if (Number.isFinite(props.labelCurveTextLength)) {
                    const pathLength = curvedTextPath.getTotalLength();
                    const textLength = Math.max(
                        0.1,
                        Math.min(1, props.labelCurveTextLength)
                    ) * pathLength;
                    textPath.setAttribute('textLength', String(textLength));
                    textPath.setAttribute('lengthAdjust', 'spacingAndGlyphs');
                }
                textPath.textContent = label.textContent;
                label.replaceChildren(textPath);
            } else {
                const [labelX, labelY] = toSvgPoint([
                    chosenPosition[1],
                    chosenPosition[0]
                ]);
                label.setAttribute('x', String(labelX));
                label.setAttribute('y', String(labelY));
                label.setAttribute(
                    'transform',
                    `rotate(${angle} ${labelX} ${labelY})`
                );
            }
            svg.appendChild(label);

            return { svg, bounds: labelBounds };
        }

        const boundaryLatLngMemo = new WeakMap();
        function getBoundaryLatLngs(lines) {
            if (!boundaryLatLngMemo.has(lines)) {
                boundaryLatLngMemo.set(lines, lines.map(line => line.map(sharedCoordsToLatLng)));
            }
            return boundaryLatLngMemo.get(lines);
        }

        function createRealmBoundaryLayers(features, props) {
            const borderColor = props.borderColor || '#0a131c';
            const lightBorderColor = blendColors(
                borderColor,
                props.fillColor || '#1e3d59',
                0.55
            );
            const boundaryLines = getBoundaryLatLngs(getRealmBoundaryLines(features));

            return [
                L.polyline(boundaryLines, {
                    color: borderColor,
                    weight: 2.5,
                    opacity: 0.95,
                    dashArray: '8 15',
                    lineCap: 'butt',
                    interactive: false
                }),
                L.polyline(boundaryLines, {
                    color: lightBorderColor,
                    weight: 2.5,
                    opacity: 0.95,
                    dashArray: '8 15',
                    dashOffset: '11.5',
                    lineCap: 'butt',
                    interactive: false
                })
            ];
        }

        function setStatus(message) {
            status.textContent = message;
            status.hidden = !message;
        }

        let introDone = false;
        function finishIntro() {
            if (introDone) return;
            introDone = true;
            const intro = document.getElementById('intro');
            const mapElement = document.getElementById('map');
            // Wait two frames so the first year is painted before the reveal starts.
            requestAnimationFrame(() => requestAnimationFrame(() => {
                mapElement.classList.add('is-revealing');
                mapElement.classList.remove('is-intro');
                intro.classList.add('is-done');
                setTimeout(() => {
                    intro.remove();
                    // A lingering filter forces costly repaints, so drop it entirely.
                    mapElement.classList.remove('is-revealing');
                }, 2400);
            }));
        }

        function showIntroError(message) {
            const intro = document.getElementById('intro');
            if (!intro || introDone) {
                setStatus(message);
                return;
            }
            intro.classList.add('has-error');
            document.getElementById('intro-text').textContent = message;
        }

        async function fetchJson(file) {
            const response = await fetch(file);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status} while loading ${file}`);
            }
            return response.json();
        }

        async function loadEuropeData() {
            try {
                [europeRegionsData, timelineDatabase, supplementalRegions, supplementalIslands, middleEastRegions, microstateRegions, historicalRegionData, pomeraniaDistrictData] = await Promise.all([
                    fetchJson('data/europe-provinces.geojson'),
                    fetchJson('data/years.json'),
                    fetchJson('data/europe-kosovo.geojson'),
                    fetchJson('data/europe-small-islands.geojson'),
                    fetchJson('data/middle-east-caucasus-provinces.geojson'),
                    fetchJson('data/europe-microstates.geojson'),
                    fetchJson('data/europe-historical-regions.geojson'),
                    fetchJson('data/europe-pomerania-1700.geojson')
                ]);
                europeRegionsData.features.push(
                    ...supplementalRegions.features,
                    ...supplementalIslands.features,
                    ...middleEastRegions.features,
                    ...microstateRegions.features,
                    ...historicalRegionData.features,
                    ...pomeraniaDistrictData.features
                );
                availableYears = Object.keys(timelineDatabase)
                    .map(Number)
                    .filter(Number.isFinite)
                    .sort((a, b) => a - b);

                if (availableYears.length === 0) {
                    throw new Error('data/years.json contains no valid years');
                }

                const slider = document.getElementById('year-slider');
                const timelineMax = Math.max(10, availableYears.length + 1);
                slider.max = String(timelineMax);
                slider.disabled = availableYears.length < 2;
                slider.value = '1';
                const marks = document.querySelector('.timeline-period-marks');
                marks.replaceChildren(...availableYears.map((_, index) => {
                    const mark = document.createElement('span');
                    mark.className = 'timeline-period-mark';
                    mark.style.setProperty(
                        '--mark-position',
                        `${((index + 1) / timelineMax) * 100}%`
                    );
                    return mark;
                }));
                // Label widths are measured on canvas, so the webfont must be ready first.
                if (document.fonts && document.fonts.load) {
                    await Promise.race([
                        document.fonts.load(`600 40px ${LABEL_FONT_NAME}`).catch(() => {}),
                        new Promise(resolve => setTimeout(resolve, 3000))
                    ]);
                }
                await loadYear(availableYears[0]);
            } catch (error) {
                console.error('Could not start the map:', error);
                showIntroError(`The map could not be loaded: ${error.message}`);
            }
        }

        async function resolveYearConfigs(year, visitedYears = new Set()) {
            const yearKey = String(year);
            const yearConfig = timelineDatabase[yearKey];
            if (!yearConfig) {
                throw new Error(`There is no valid map data for ${yearKey}.`);
            }
            if (visitedYears.has(yearKey)) {
                throw new Error(`Year data contains an inheritance cycle at ${yearKey}.`);
            }

            const nextVisitedYears = new Set(visitedYears);
            nextVisitedYears.add(yearKey);

            if (yearConfig.baseYear !== undefined) {
                if (!yearConfig.overrides || typeof yearConfig.overrides !== 'object') {
                    throw new Error(`Year ${yearKey} has no valid realm overrides.`);
                }
                if (yearConfig.additions !== undefined &&
                    !Array.isArray(yearConfig.additions)) {
                    throw new Error(`Year ${yearKey} has no valid added realm list.`);
                }

                const inheritedConfigs = await resolveYearConfigs(
                    yearConfig.baseYear,
                    nextVisitedYears
                );
                const unmatchedRealms = new Set(Object.keys(yearConfig.overrides));
                const resolvedConfigs = inheritedConfigs.map(realmConfig => {
                    const realm = realmConfig.properties?.realm;
                    if (!realm || !Object.prototype.hasOwnProperty.call(
                        yearConfig.overrides,
                        realm
                    )) {
                        return realmConfig;
                    }

                    const override = yearConfig.overrides[realm];
                    unmatchedRealms.delete(realm);
                    return {
                        ...realmConfig,
                        ...(Array.isArray(override.provinces)
                            ? { provinces: override.provinces }
                            : {}),
                        properties: {
                            ...realmConfig.properties,
                            ...override.properties
                        }
                    };
                });
                if (unmatchedRealms.size > 0) {
                    throw new Error(
                        `Year ${yearKey} overrides unknown realms: ${[...unmatchedRealms].join(', ')}.`
                    );
                }
                const existingRealms = new Set(
                    resolvedConfigs.map(config => config.properties?.realm).filter(Boolean)
                );
                const additions = yearConfig.additions || [];
                additions.forEach(addition => {
                    const realm = addition.properties?.realm;
                    if (!realm || !Array.isArray(addition.provinces)) {
                        throw new Error(
                            `Year ${yearKey} contains an added realm without a name or province list.`
                        );
                    }
                    if (existingRealms.has(realm)) {
                        throw new Error(
                            `Year ${yearKey} adds a realm that already exists: ${realm}.`
                        );
                    }
                    existingRealms.add(realm);
                });
                return [...resolvedConfigs, ...additions];
            }

            if (!Array.isArray(yearConfig.countries)) {
                throw new Error(`Year ${yearKey} has no valid realm list.`);
            }
            return Promise.all(
                yearConfig.countries.map(country => fetchJson(country.file))
            );
        }

        async function loadYear(year) {
            const loadId = ++currentLoad;
            const yearKey = String(year);
            const isStale = () => loadId !== currentLoad;
            const yearDisplay = document.getElementById('year-display');
            const isFirstLoad = activeLayers.length === 0;
            const cached = yearLayerCache.get(yearKey);
            requestedYearKey = yearKey;
            clearTimeout(prefetchTimer);
            prefetchToken++;

            document.getElementById('current-year').textContent = year;
            if (!isFirstLoad && !cached) {
                yearDisplay.classList.add('is-pending');
                yearPanes[activePaneIndex].element.classList.add('is-dimmed');
            }

            try {
                let result = cached;
                if (!result) {
                    // Let the dimmed state paint before building.
                    await nextFrame();
                    if (isStale()) return;
                    const buildIsStale = () => requestedYearKey !== yearKey;
                    result = await buildYear(yearKey, buildIsStale);
                    if (!result && !isStale()) result = await buildYear(yearKey, buildIsStale);
                    if (isStale() || !result) return;
                }

                closeRealmPanel();
                map.closePopup();
                showYearLayers(result.layers);
                cacheYearLayers(yearKey, result);
                yearDisplay.classList.remove('is-pending');
                const yearNote = document.getElementById('year-note');
                yearNote.textContent = timelineDatabase[String(year)]?.note || '';
                yearNote.hidden = !yearNote.textContent;

                if (result.missingIds.length > 0) {
                    console.warn(`Region IDs are missing from the map registry for ${year}:`, result.missingIds);
                    setStatus(`The map loaded, but ${result.missingIds.length} region(s) are missing from the registry.`);
                } else {
                    setStatus('');
                }
                schedulePrefetch(year);
                if (isFirstLoad) finishIntro();
            } catch (error) {
                if (loadId !== currentLoad) return;
                yearDisplay.classList.remove('is-pending');
                yearPanes[activePaneIndex].element.classList.remove('is-dimmed');
                console.error(`Could not load map data for ${year}:`, error);
                if (isFirstLoad) {
                    showIntroError(`Map data for ${year} could not be loaded: ${error.message}`);
                } else {
                    setStatus(`Map data for ${year} could not be loaded: ${error.message}`);
                }
            }
        }

        function createRealmPopup(name, props, year) {
            const popup = document.createElement('div');
            popup.className = 'realm-popup';

            const title = document.createElement('button');
            title.className = 'realm-popup__title';
            title.type = 'button';
            title.textContent = props.realm || 'Unknown realm';
            title.setAttribute('aria-label', `Open information about ${title.textContent}`);
            title.addEventListener('click', () => {
                openRealmPanel(props);
                map.closePopup();
            });

            const province = document.createElement('span');
            province.className = 'realm-popup__province';
            province.textContent = `${name} · ${year}`;

            popup.append(title, province);
            return popup;
        }

        const slider = document.getElementById('year-slider');

        document.querySelector('.realm-panel__close').addEventListener(
            'click',
            closeRealmPanel
        );
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') closeRealmPanel();
        });

        slider.addEventListener('input', (e) => {
            const selectedIndex = Math.min(
                Math.max(Number(e.target.value) - 1, 0),
                availableYears.length - 1
            );
            slider.value = String(selectedIndex + 1);
            loadYear(availableYears[selectedIndex]);
        });

        loadEuropeData();
    </script>
</body>
</html>
